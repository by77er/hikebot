name: Undercurrent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Undercurrent at 9b69f17: a model account out of credit leaves its semantic
# rules unjudged with a warning instead of failing the check. No release has
# it yet, so the action builds uc from source; go back to @v0 once a v0
# release includes it.
jobs:
  commands:
    name: ${{ github.event.pull_request.draft && 'commands (draft, not run)' || 'commands' }}
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        uses: by77er/undercurrent@9b69f1767dd68f128dea4e9a62e2fc70189617b2
        with:
          mode: commands
      - if: github.event_name == 'push'
        uses: by77er/undercurrent@9b69f1767dd68f128dea4e9a62e2fc70189617b2
        with:
          mode: commands
          all: "true"
          rules-from: head
      # Regenerates docs/screenshots/ and fails when a committed PNG differs
      # ("Take the screenshots" in src/web/AGENTS.md). The regenerated files
      # are kept as an artifact, to compare with the committed ones.
      - name: Check the screenshots are current
        id: screenshots
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: npm run screenshots:check
      - name: Keep the regenerated screenshots
        if: ${{ !cancelled() && steps.screenshots.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.event.pull_request.head.sha }}
          path: docs/screenshots/
  semantic:
    name: ${{ github.event.pull_request.draft && 'semantic (draft, not run)' || 'semantic' }}
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: by77er/undercurrent@9b69f1767dd68f128dea4e9a62e2fc70189617b2
        with:
          mode: semantic
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
  review:
    name: ${{ github.event.pull_request.draft && 'review (draft, not run)' || 'review' }}
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    needs: [commands, semantic]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: by77er/undercurrent@9b69f1767dd68f128dea4e9a62e2fc70189617b2
        with:
          mode: review
