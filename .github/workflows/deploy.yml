name: Deploy

on:
  workflow_run:
    workflows: [Undercurrent]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HEALTH_URL: https://hiking.bitcru.sh/healthz
      HEALTH_LINE: hikebot is running
      MAP_SAMPLE_URL: https://hiking.bitcru.sh/maps/sample.png
    steps:
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          missing=0
          names="CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISCORD_PUBLIC_KEY DISCORD_APPLICATION_ID DISCORD_BOT_TOKEN DISCORD_CLIENT_SECRET SIGNING_SECRET"
          for name in $names; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing or empty. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."
              missing=1
            fi
          done
          if [ "$missing" = 0 ]; then
            echo "These secrets are set: $names"
          fi
          exit "$missing"

      - name: Skip unless the commit is the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$DEPLOY_SHA" ]; then
            echo "Deploying $DEPLOY_SHA, the tip of main."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $DEPLOY_SHA: main has moved on to $tip, whose own run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.tip.outputs.deploy == 'true'
        run: npm ci

      - name: Write the Worker secrets file
        if: steps.tip.outputs.deploy == 'true'
        env:
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node -e '
          const {
            DISCORD_PUBLIC_KEY,
            DISCORD_APPLICATION_ID,
            DISCORD_BOT_TOKEN,
            DISCORD_CLIENT_SECRET,
            SIGNING_SECRET,
            SECRETS_FILE,
          } = process.env;
          require("node:fs").writeFileSync(
            SECRETS_FILE,
            JSON.stringify({
              DISCORD_PUBLIC_KEY,
              DISCORD_APPLICATION_ID,
              DISCORD_BOT_TOKEN,
              DISCORD_CLIENT_SECRET,
              SIGNING_SECRET,
            }),
            { mode: 0o600 },
          );
          '

      # --secrets-file sets the secrets in the same upload as the code, which
      # wrangler accepts for a Worker that does not exist yet even though
      # wrangler.jsonc lists them under secrets.required.
      - name: Deploy
        if: steps.tip.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json --message ${{ env.DEPLOY_SHA }}

      - name: Delete the Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Register slash commands
        if: steps.tip.outputs.deploy == 'true'
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: npm run register --if-present

      - name: Smoke check
        if: steps.tip.outputs.deploy == 'true'
        env:
          DEADLINE_SECONDS: "120"
        run: |
          deadline=$((SECONDS + DEADLINE_SECONDS))
          body_file=$(mktemp)
          while :; do
            status=$(curl -sS --max-time 10 -o "$body_file" -w '%{http_code}' "$HEALTH_URL" 2>"$body_file.err") || status="curl failed: $(cat "$body_file.err")"
            if [ "$status" = "200" ] && grep -qF "$HEALTH_LINE" "$body_file"; then
              echo "$HEALTH_URL answered 200: $(head -c 200 "$body_file")"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$HEALTH_URL did not return 200 with \"$HEALTH_LINE\" within $DEADLINE_SECONDS seconds."
              echo "Last response: $status"
              head -c 2000 "$body_file"
              echo
              exit 1
            fi
            echo "Not healthy yet ($status); retrying in 5 seconds."
            sleep 5
          done

      # The sample map picture proves the map pictures work in production:
      # 200 with a PNG of a plausible size passes; 404 means the map data has
      # not been built yet and passes with a notice; anything else fails.
      - name: Check the sample map picture
        if: steps.tip.outputs.deploy == 'true'
        env:
          DEADLINE_SECONDS: "180"
          MIN_BYTES: "20000"
          MAX_BYTES: "1000000"
        run: |
          deadline=$((SECONDS + DEADLINE_SECONDS))
          body_file=$(mktemp)
          while :; do
            result=$(curl -sS --max-time 60 -o "$body_file" -w '%{http_code} %{content_type}' "$MAP_SAMPLE_URL" 2>"$body_file.err") || result="curl failed: $(cat "$body_file.err")"
            status=${result%% *}
            content_type=${result#* }
            bytes=$(wc -c < "$body_file")
            signature=$(head -c 8 "$body_file" | od -An -tx1 | tr -d ' \n')
            if [ "$status" = "200" ] && [ "$content_type" = "image/png" ] && [ "$signature" = "89504e470d0a1a0a" ] && [ "$bytes" -ge "$MIN_BYTES" ] && [ "$bytes" -le "$MAX_BYTES" ]; then
              echo "::notice title=Map picture::$MAP_SAMPLE_URL answered 200 image/png, $bytes bytes."
              exit 0
            fi
            if [ "$status" = "404" ]; then
              echo "::notice title=Map picture::$MAP_SAMPLE_URL answered 404: the map data has not been built yet, so there is no picture to check. Run the Map data workflow (\"Rebuild the map data\" in maps/AGENTS.md)."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$MAP_SAMPLE_URL did not answer 200 with a PNG of $MIN_BYTES to $MAX_BYTES bytes (or 404) within $DEADLINE_SECONDS seconds. Last response: $result, $bytes bytes."
              head -c 500 "$body_file" | tr -c '[:print:]\n' '.'
              echo
              exit 1
            fi
            echo "No picture yet ($result, $bytes bytes); retrying in 10 seconds."
            sleep 10
          done
